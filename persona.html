<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAYRGRND // Persona Profile</title>
    <style>
        :root {
            --bg-base: #0a0b0e;
            --surface-dark: #12151c;
            --surface-card: #181c26;
            --accent-purple: #8B5CF6;
            --accent-purple-glow: rgba(139, 92, 246, 0.25);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --hero-color: #38BDF8;
            --villain-color: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        .profile-container {
            width: 100%;
            max-width: 480px;
            background: var(--surface-dark);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Profile Banner & Header */
        .banner {
            height: 140px;
            background: linear-gradient(135deg, #2e1065 0%, #1a0826 100%);
            position: relative;
            border-bottom: 1px solid var(--border-light);
        }

        .verified-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .avatar-wrap {
            position: absolute;
            bottom: -40px;
            left: 2rem;
            width: 84px;
            height: 84px;
            border-radius: 20px;
            background: var(--surface-card);
            border: 3px solid var(--surface-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .profile-body {
            padding: 3rem 2rem 2rem 2rem;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .user-details h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .user-details p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .rank-tag {
            background: var(--accent-purple-glow);
            border: 1px solid var(--accent-purple);
            color: #A78BFA;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        /* Ratings Section */
        .section-box {
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .stars {
            color: #F59E0B;
            letter-spacing: 2px;
        }

        /* Honour Spectrum */
        .spectrum-bar {
            height: 8px;
            background: #2A2F3D;
            border-radius: 4px;
            position: relative;
            margin: 1rem 0 0.5rem 0;
            overflow: hidden;
        }

        .spectrum-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, var(--villain-color), var(--accent-purple), var(--hero-color));
            transition: width 0.3s ease;
        }

        .spectrum-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .label-villain { color: var(--villain-color); }
        .label-hero { color: var(--hero-color); }

        /* Traits Grid */
        .traits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .trait-card {
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 0.75rem;
            text-align: center;
        }

        .trait-card .val {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-purple);
        }

        .trait-card .lbl {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
        }

        /* Achievements Checklist */
        .achievements-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .achievement-item.completed {
            color: var(--text-primary);
        }

        .checkbox {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid var(--border-light);
            background: #2A2F3D;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .completed .checkbox {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        /* Demo Controls Area */
        .demo-controls {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-light);
        }

        .demo-title {
            font-size: 0.75rem;
            color: var(--accent-purple);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-purple);
        }

        .btn-action {
            width: 100%;
            padding: 0.9rem;
            border-radius: 12px;
            border: none;
            background: var(--accent-purple);
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-purple-glow);
            transition: transform 0.2s;
            margin-top: 0.5rem;
        }

        .btn-action:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- Banner Header -->
        <div class="banner">
            <span class="verified-badge">LEDGER VERIFIED</span>
            <div class="avatar-wrap">🦍</div>
        </div>

        <div class="profile-body">
            <!-- Basic Details -->
            <div class="user-info">
                <div class="user-details">
                    <h2>Nugget</h2>
                    <p>@nugget_raw // ID: 0x8F3...</p>
                </div>
                <span class="rank-tag">LEGEND</span>
            </div>

            <!-- Star Rating Section -->
            <div class="section-box">
                <div class="metric-header">
                    <span>REPUTATION (STAR RATING)</span>
                    <span class="stars" id="starDisplay">★★★★☆</span>
                </div>
            </div>

            <!-- Honour Level Spectrum -->
            <div class="section-box">
                <div class="metric-header">
                    <span>HONOUR LEVEL</span>
                    <span id="honourStatusText" style="color: var(--accent-purple);">NEUTRAL</span>
                </div>
                <div class="spectrum-bar">
                    <div class="spectrum-fill" id="spectrumFill"></div>
                </div>
                <div class="spectrum-labels">
                    <span class="label-villain">VILLAIN / PRICK</span>
                    <span class="label-hero">HERO</span>
                </div>
            </div>

            <!-- Core Persona Traits -->
            <div class="traits-grid">
                <div class="trait-card">
                    <div class="val">84</div>
                    <div class="lbl">Charisma</div>
                </div>
                <div class="trait-card">
                    <div class="val">12</div>
                    <div class="lbl">Empathy</div>
                </div>
                <div class="trait-card">
                    <div class="val">99</div>
                    <div class="lbl">Integrity</div>
                </div>
            </div>

            <!-- On-Ledger Achievements -->
            <div class="section-box">
                <div class="metric-header" style="margin-bottom: 1rem;">
                    <span>ACHIEVEMENTS</span>
                </div>
                <div class="achievements-list">
                    <div class="achievement-item completed">
                        <div class="checkbox">✓</div>
                        <span>Create your first crew</span>
                    </div>
                    <div class="achievement-item completed">
                        <div class="checkbox">✓</div>
                        <span>Real-world Link-Up completed</span>
                    </div>
                    <div class="achievement-item">
                        <div class="checkbox"></div>
                        <span>Host a 10+ member event</span>
                    </div>
                </div>
            </div>

            <button class="btn-action">REQUEST LINK-UP</button>

            <!-- Live Simulator for Team Testing -->
            <div class="demo-controls">
                <div class="demo-title">PROTOTYPE CONTROLS (TEST REP)</div>
                <div class="control-group">
                    <label>Honour Level (Villain <-> Hero):</label>
                    <input type="range" id="honourSlider" min="0" max="100" value="50">
                </div>
                <div class="control-group">
                    <label>Star Rating:</label>
                    <input type="range" id="starSlider" min="1" max="5" value="4">
                </div>
            </div>
        </div>
    </div>

    <script>
        const honourSlider = document.getElementById('honourSlider');
        const starSlider = document.getElementById('starSlider');
        const spectrumFill = document.getElementById('spectrumFill');
        const honourStatusText = document.getElementById('honourStatusText');
        const starDisplay = document.getElementById('starDisplay');

        // Dynamic update logic for Honour & Star Ratings
        honourSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            spectrumFill.style.width = `${val}%`;

            if (val < 35) {
                honourStatusText.innerText = "VILLAIN / PRICK";
                honourStatusText.style.color = "var(--villain-color)";
            } else if (val > 65) {
                honourStatusText.innerText = "HERO";
                honourStatusText.style.color = "var(--hero-color)";
            } else {
                honourStatusText.innerText = "BALANCED";
                honourStatusText.style.color = "var(--accent-purple)";
            }
        });

        starSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            let starStr = '';
            for (let i = 0; i < 5; i++) {
                starStr += (i < val) ? '★' : '☆';
            }
            starDisplay.innerText = starStr;
        });
    </script>
</body>
</html>
