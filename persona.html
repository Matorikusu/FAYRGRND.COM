<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAYRGRND - Mobile Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Theme Presets */
    .theme-purple { --theme-accent: #8b5cf6; --theme-glow: rgba(139, 92, 246, 0.25); }
    .theme-cyan   { --theme-accent: #00f2ff; --theme-glow: rgba(0, 242, 255, 0.25); }
    .theme-gold   { --theme-accent: #ffb700; --theme-glow: rgba(255, 183, 0, 0.25); }

    .accent-border { border-color: var(--theme-accent); }
    .accent-bg     { background-color: var(--theme-accent); }
    .accent-glow   { box-shadow: 0 0 20px var(--theme-glow); }
    .accent-text   { color: var(--theme-accent); }
  </style>
</head>
<body class="bg-[#0a0b0e] text-slate-100 flex justify-center min-h-screen">

  <!-- Mobile View Container -->
  <main className="w-full max-w-[420px] bg-[#0f1117] min-h-screen flex flex-col p-4 border-x border-slate-800">
    
    <!-- Top Bar -->
    <header className="flex justify-between items-center py-3 mb-4 border-b border-slate-800">
      <h1 className="text-xl font-black tracking-wider">FAYR<span className="accent-text">GRND</span></h1>
      <span id="wallet-badge" className="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-1 rounded-md border border-slate-700">
        0x71C...4f92
      </span>
    </header>

    <!-- Profile Card (Dynamic Theme Shell) -->
    <section id="profile-card" className="theme-purple accent-border accent-glow bg-[#181c26] p-5 rounded-2xl border transition-all duration-300 mb-6">
      
      <!-- Avatar & Basic Info -->
      <div className="flex items-center gap-4 mb-4">
        <div className="relative">
          <div className="w-16 h-16 rounded-full bg-slate-700 flex items-center justify-center font-bold text-2xl border-2 accent-border">
            J
          </div>
          <span className="absolute bottom-0 right-0 w-4 h-4 bg-emerald-500 border-2 border-[#181c26] rounded-full"></span>
        </div>
        <div>
          <h2 className="font-bold text-lg">Joe_Pioneer</h2>
          <p className="text-xs text-slate-400">Pioneer Class • Level 1</p>
        </div>
      </div>

      <!-- Bio Inputs -->
      <div className="mb-4">
        <label className="block text-[10px] font-bold tracking-wider text-slate-400 mb-1">PERSONA BIO</label>
        <textarea id="bio-input" className="w-full bg-[#0a0b0e] border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-slate-500 resize-none">Building the next decentralized hub. Testing micro-interactions.</textarea>
      </div>

      <!-- Theme Selector (Customisation Shop Preview) -->
      <div>
        <label className="block text-[10px] font-bold tracking-wider text-slate-400 mb-2">EQUIPPED THEME</label>
        <div className="grid grid-cols-3 gap-2">
          <button onclick="setTheme('theme-purple')" className="py-2 text-[11px] font-bold rounded-lg border border-slate-700 bg-purple-950/40 text-purple-300 hover:border-purple-500">
            Purple
          </button>
          <button onclick="setTheme('theme-cyan')" className="py-2 text-[11px] font-bold rounded-lg border border-slate-700 bg-cyan-950/40 text-cyan-300 hover:border-cyan-400">
            Cyan
          </button>
          <button onclick="setTheme('theme-gold')" className="py-2 text-[11px] font-bold rounded-lg border border-slate-700 bg-amber-950/40 text-amber-300 hover:border-amber-400">
            Gold
          </button>
        </div>
      </div>
    </section>

    <!-- Save Action (Simulated Micro-Fee Execution) -->
    <button onclick="saveProfile()" className="accent-bg text-black font-extrabold py-3.5 rounded-xl text-xs uppercase tracking-wider hover:opacity-90 transition-opacity mt-auto">
      Save Profile ($0.001 Fee)
    </button>

    <!-- Console Log for Test Verification -->
    <p id="status-log" className="text-[10px] text-center font-mono text-slate-500 mt-3"></p>
  </main>

  <script>
    function setTheme(themeName) {
      const card = document.getElementById('profile-card');
      card.className = `${themeName} accent-border accent-glow bg-[#181c26] p-5 rounded-2xl border transition-all duration-300 mb-6`;
      document.getElementById('status-log').innerText = `Theme switched to: ${themeName}`;
    }

    function saveProfile() {
      const bio = document.getElementById('bio-input').value;
      document.getElementById('status-log').innerText = `Profile Saved! Fee executed on-chain.`;
      console.log("Updated Profile Bio:", bio);
    }
  </script>
</body>
</html>
