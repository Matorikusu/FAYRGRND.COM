<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAYRGRND // App Shell</title>
    <style>
        :root {
            --bg-base: #0a0b0e;
            --surface-dark: #12151c;
            --surface-card: #181c26;
            --surface-subcard: #0f1117;
            --accent-purple: #8B5CF6;
            --accent-purple-glow: rgba(139, 92, 246, 0.25);
            --cyan-accent: #00f2ff;
            --gold-accent: #ffb700;
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Mobile Wrapper */
        .app-frame {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            max-height: 840px;
            background: var(--surface-dark);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px var(--accent-purple-glow);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (max-width: 480px) {
            .app-frame {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                border: none;
            }
        }

        /* App Header */
        .app-header {
            background: rgba(18, 21, 28, 0.8);
            backdrop-filter: blur(12px);
            padding: 0.85rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }

        .app-header-logo {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: -0.5px;
        }

        .app-header-logo span { color: var(--accent-purple); }

        .app-header-status {
            font-size: 0.65rem;
            color: var(--cyan-accent);
            border: 1px solid var(--cyan-accent);
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
            font-family: monospace;
        }

        /* Viewport */
        .app-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 0.85rem;
        }

        /* Card System */
        .app-card {
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .app-card-title {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.65rem;
            text-align: center;
        }

        /* Profile Details */
        .profile-identity { text-align: center; }

        .avatar-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .badge-side {
            color: var(--gold-accent);
            font-weight: 900;
            font-size: 0.75rem;
            font-style: italic;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--gold-accent);
            background: url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150') center/cover;
            margin: 0 auto;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 0.25rem;
            background: transparent;
            border: none;
            text-align: center;
            width: 100%;
        }

        .user-name:focus { outline: none; border-bottom: 1px solid var(--accent-purple); }

        .user-handle {
            color: var(--accent-purple);
            font-size: 0.75rem;
            font-weight: 600;
            font-family: monospace;
            margin-top: 2px;
        }

        .stars-row { color: var(--gold-accent); font-size: 0.9rem; margin: 0.4rem 0 0.65rem 0; }

        .honour-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.6rem;
            font-weight: 800;
        }

        .honour-track {
            flex: 1;
            height: 4px;
            background: #ef4444;
            border-radius: 2px;
            position: relative;
        }

        .honour-thumb {
            position: absolute;
            right: 30%;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--cyan-accent);
            box-shadow: 0 0 6px var(--cyan-accent);
        }

        /* Inputs & Customizer */
        .bio-textarea {
            width: 100%;
            background: var(--surface-subcard);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-primary);
            padding: 0.6rem;
            font-size: 0.75rem;
            resize: none;
            margin-bottom: 0.5rem;
        }

        .bio-textarea:focus { outline: none; border-color: var(--accent-purple); }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
        }

        .theme-btn {
            background: var(--surface-subcard);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            padding: 0.4rem;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
        }

        .theme-btn.active { border-color: var(--accent-purple); color: var(--text-primary); }

        /* Save Button */
        .btn-action {
            width: 100%;
            background: var(--accent-purple);
            color: #fff;
            border: none;
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-purple-glow);
            margin-top: 0.5rem;
        }

        /* Nav */
        .app-nav {
            background: rgba(18, 21, 28, 0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-light);
            padding: 0.65rem 0.25rem;
            display: flex;
            justify-content: space-around;
        }

        .app-nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .app-nav-btn.active { color: var(--accent-purple); }
    </style>
</head>
<body>

    <div class="app-frame">
        <!-- Header -->
        <div class="app-header">
            <div class="app-header-logo">FAYR<span>GRND</span></div>
            <div class="app-header-status" id="wallet-status">0x71C...4f92</div>
        </div>

        <!-- Viewport -->
        <div class="app-viewport">
            <!-- Profile Identity Card -->
            <div class="app-card profile-identity" id="main-profile-card">
                <div class="avatar-wrap">
                    <span class="badge-side">LEGEND</span>
                    <div class="avatar-circle"></div>
                    <span class="badge-side">LEGEND</span>
                </div>

                <input type="text" class="user-name" value="Nugget" />
                <div class="user-handle" id="user-handle-display">@0x71C...4f92</div>

                <div class="stars-row">★ ★ ★ ★ ☆</div>

                <div class="honour-section">
                    <span style="color: #ef4444;">VILLAIN</span>
                    <div class="honour-track">
                        <div class="honour-thumb"></div>
                    </div>
                    <span style="color: var(--cyan-accent);">HERO</span>
                </div>
            </div>

            <!-- Customization & Bio Card -->
            <div class="app-card">
                <div class="app-card-title">PERSONA CONFIGURATION</div>
                <textarea class="bio-textarea" rows="3">Building the next decentralized hub. Testing micro-interactions and on-chain identity.</textarea>
                
                <div class="app-card-title" style="margin-top: 0.5rem;">EQUIPPED THEME</div>
                <div class="theme-buttons">
                    <button class="theme-btn active" onclick="applyTheme('purple', this)">Purple Neon</button>
                    <button class="theme-btn" onclick="applyTheme('cyan', this)">Cyber Cyan</button>
                    <button class="theme-btn" onclick="applyTheme('gold', this)">Gold Legend</button>
                </div>
            </div>

            <button class="btn-action" onclick="savePersona()">SAVE PROFILE ($0.001 GAS)</button>
        </div>

        <!-- Bottom Navigation -->
        <div class="app-nav">
            <button class="app-nav-btn active"><span style="font-size: 0.95rem;">👤</span>Profile</button>
            <button class="app-nav-btn"><span style="font-size: 0.95rem;">⚡</span>Crews</button>
            <button class="app-nav-btn"><span style="font-size: 0.95rem;">📡</span>Reach Out</button>
            <button class="app-nav-btn"><span style="font-size: 0.95rem;">🔗</span>Link-Ups</button>
        </div>
    </div>

    <script>
        function applyTheme(theme, btn) {
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const card = document.getElementById('main-profile-card');
            if (theme === 'purple') {
                card.style.borderColor = '#8B5CF6';
                card.style.boxShadow = '0 0 15px rgba(139, 92, 246, 0.3)';
            } else if (theme === 'cyan') {
                card.style.borderColor = '#00f2ff';
                card.style.boxShadow = '0 0 15px rgba(0, 242, 255, 0.3)';
            } else if (theme === 'gold') {
                card.style.borderColor = '#ffb700';
                card.style.boxShadow = '0 0 15px rgba(255, 183, 0, 0.3)';
            }
        }

        function savePersona() {
            alert("Persona state updated! Micro-transaction sent to testnet ledger.");
        }
    </script>
</body>
</html>
