<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAYRGRND · Phase 1</title>
<style>
:root {
  --bg:#0a0b0e; --surface:#12151c; --card:#181c26; --sub:#0f1117;
  --purple:#8B5CF6; --purple-glow:rgba(139,92,246,0.28);
  --cyan:#22d3ee; --gold:#fbbf24; --red:#ef4444;
  --border:rgba(255,255,255,0.08); --text:#F8FAFC; --muted:#94A3B8; --dim:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100vh;-webkit-font-smoothing:antialiased}
.frame{width:100%;max-width:400px;height:100vh;max-height:860px;background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.85),0 0 40px var(--purple-glow);display:flex;flex-direction:column;position:relative}
@media(max-width:480px){.frame{height:100vh;max-height:100vh;border-radius:0;border:none}}

.auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.4rem;background:var(--bg)}
.auth-logo{text-align:center;margin-bottom:2rem}
.auth-logo h1{font-size:1.7rem;font-weight:800;letter-spacing:-0.8px}
.auth-logo h1 span{color:var(--purple)}
.auth-logo p{font-size:0.8rem;color:var(--muted);margin-top:0.3rem}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.3rem}
.auth-tabs{display:flex;gap:0.4rem;margin-bottom:1.1rem}
.auth-tab{flex:1;padding:0.55rem;border:1px solid var(--border);background:var(--sub);color:var(--muted);border-radius:10px;font-weight:600;font-size:0.8rem;cursor:pointer}
.auth-tab.active{background:var(--purple);border-color:var(--purple);color:#fff}
.fg{margin-bottom:0.85rem}
.fg label{display:block;font-size:0.65rem;font-weight:600;color:var(--muted);margin-bottom:0.25rem;text-transform:uppercase;letter-spacing:0.3px}
.fg input, .fg select, .fg textarea{width:100%;background:var(--sub);border:1px solid var(--border);border-radius:10px;padding:0.65rem 0.8rem;color:var(--text);font-size:0.9rem}
.fg input:focus, .fg select:focus, .fg textarea:focus{outline:none;border-color:var(--purple)}
.fg textarea{min-height:70px;resize:none;line-height:1.4}
.auth-btn{width:100%;background:var(--purple);color:#fff;border:none;padding:0.8rem;border-radius:12px;font-weight:700;font-size:0.9rem;cursor:pointer;margin-top:0.2rem;box-shadow:0 4px 14px var(--purple-glow)}
.auth-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;font-size:0.75rem;padding:0.5rem 0.7rem;border-radius:8px;margin-bottom:0.8rem;display:none}
.auth-hint{text-align:center;font-size:0.7rem;color:var(--dim);margin-top:1rem;line-height:1.4}
.link-action{font-size:0.78rem;color:var(--purple);font-weight:600;cursor:pointer}

.app{display:none;flex-direction:column;height:100%}
.app.active{display:flex}
.header{background:rgba(18,21,28,0.94);backdrop-filter:blur(16px);padding:0.6rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.header-logo{font-weight:800;font-size:0.9rem;letter-spacing:-0.4px}
.header-logo span{color:var(--purple)}
.header-right{display:flex;align-items:center;gap:0.4rem}
.balance{background:var(--sub);border:1px solid var(--border);padding:0.18rem 0.48rem;border-radius:20px;font-size:0.68rem;font-weight:700;color:var(--gold);font-family:monospace}
.status-pill{font-size:0.56rem;color:var(--cyan);border:1px solid rgba(34,211,238,0.35);padding:2px 6px;border-radius:10px;font-weight:600;font-family:monospace}
.viewport{flex:1;overflow-y:auto;padding:0.7rem;background:var(--bg)}
.viewport::-webkit-scrollbar{width:0}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0.9rem;margin-bottom:0.6rem}
.card-title{font-size:0.62rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem}

.profile-card{text-align:center;position:relative;padding:1.1rem 0.9rem 1rem;border-width:2px}
.profile-card .gear{position:absolute;top:0.6rem;left:0.6rem;background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer}
.avatar-wrap{position:relative;display:inline-block;margin-bottom:0.35rem}
.avatar{width:88px;height:88px;border-radius:50%;border:2.5px solid var(--gold);background:#1a1a1a center/cover;object-fit:cover}
.avatar-edit{position:absolute;bottom:0;right:0;width:26px;height:26px;background:var(--purple);border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:0.65rem;cursor:pointer;color:#fff}
.pname{font-size:1.25rem;font-weight:800;margin-top:0.15rem}
.ptitle{font-size:0.68rem;font-weight:800;letter-spacing:0.5px;margin-top:0.1rem;text-transform:uppercase}
.phandle{color:var(--purple);font-size:0.78rem;font-family:monospace;margin-top:0.15rem}
.up-count{display:inline-flex;align-items:center;gap:4px;background:rgba(34,211,238,0.1);border:1px solid rgba(34,211,238,0.22);color:var(--cyan);font-size:0.7rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:20px;margin-top:0.35rem;font-family:monospace}
.stars-row{font-size:0.95rem;letter-spacing:2px;margin:0.4rem 0 0.1rem}
.score{font-size:0.72rem;color:var(--muted);font-weight:600}
.honour{display:flex;align-items:center;gap:8px;font-size:0.55rem;font-weight:800;margin-top:0.45rem}
.honour-track{flex:1;height:4px;background:linear-gradient(to right,#ef4444,#f97316,#eab308,#22c55e,#22d3ee);border-radius:2px;position:relative}
.honour-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--cyan);box-shadow:0 0 6px var(--cyan)}

.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:0.4rem;margin-top:0.2rem}
.trait{text-align:center;padding:0.55rem 0.2rem;background:var(--sub);border-radius:10px;border:1px solid var(--border)}
.trait-name{font-size:0.68rem;font-weight:700}
.trait-lv{font-size:0.72rem;color:var(--purple);font-weight:800;margin-top:0.15rem}

.ach-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
.ach-pct{font-size:0.72rem;font-weight:700;color:var(--cyan)}
.ach-row{display:flex;justify-content:space-between;align-items:center;padding:0.38rem 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.76rem}
.ach-row:last-child{border-bottom:none}
.ach-boxes{display:flex;gap:3px}
.ach-box{width:14px;height:14px;border-radius:3px;border:1.5px solid rgba(34,211,238,0.4)}
.ach-box.on{background:var(--cyan);border-color:var(--cyan)}

.theme-select{width:100%;background:var(--sub);border:1px solid var(--border);border-radius:10px;padding:0.55rem 0.7rem;color:var(--text);font-size:0.85rem}
.store-link{display:block;text-align:center;font-size:0.72rem;color:var(--purple);font-weight:600;padding:0.35rem 0 0;cursor:pointer}
.bio{width:100%;background:var(--sub);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:0.55rem;font-size:0.8rem;resize:none;line-height:1.4;min-height:56px}
.bio:focus{outline:none;border-color:var(--purple)}

.btn{width:100%;background:var(--purple);color:#fff;border:none;padding:0.7rem;border-radius:11px;font-weight:700;font-size:0.8rem;cursor:pointer;box-shadow:0 4px 14px var(--purple-glow)}
.btn.secondary{background:var(--sub);border:1px solid var(--border);box-shadow:none;color:var(--text)}
.btn.small{padding:0.45rem;font-size:0.72rem}
.btn.danger{background:#7f1d1d;box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0.4rem}

.crews-banner{background:linear-gradient(135deg,#1a1a24,#0f0f14);border-radius:14px;padding:1.4rem 1rem;text-align:center;margin-bottom:0.7rem;border:1px solid var(--border)}
.crews-banner h1{font-size:1.8rem;font-weight:900;letter-spacing:-1px;text-transform:lowercase}

.crew-section{margin-bottom:1rem}
.crew-bar{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:0.5rem 0.8rem;margin-bottom:0.5rem;cursor:pointer}
.crew-bar.purple{background:var(--purple);color:#fff}
.crew-bar.white{background:#e2e8f0;color:#0f172a}
.crew-bar.dark{background:#1e1e28;color:#e2e8f0;border:1px solid var(--border)}
.crew-bar .cb-name{font-weight:800;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.3px}
.crew-bar .cb-stars{font-size:0.75rem;letter-spacing:1px}
.crew-bar.joined::after{content:'JOINED';font-size:0.55rem;font-weight:800;margin-left:0.4rem;opacity:0.85;letter-spacing:0.5px}

.h-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;margin:0 -0.7rem;padding:0 0.7rem}
.h-scroll::-webkit-scrollbar{display:none}
.h-row{display:flex;gap:0.45rem;width:max-content;padding-bottom:0.15rem}

.post-tile{width:170px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.7rem;scroll-snap-align:start;cursor:pointer}
.post-tile .pt-head{display:flex;align-items:center;gap:0.35rem;margin-bottom:0.35rem}
.post-tile .pt-av{width:24px;height:24px;border-radius:50%;background:#2a2a30;border:1.5px solid var(--gold);flex-shrink:0}
.post-tile .pt-name{font-size:0.72rem;font-weight:700}
.post-tile .pt-text{font-size:0.74rem;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.post-tile .pt-join{font-size:0.65rem;font-weight:700;color:var(--cyan);margin-top:0.35rem}

.prompt-join{background:rgba(139,92,246,0.12);border:1px dashed rgba(139,92,246,0.4);border-radius:12px;padding:0.9rem;text-align:center;margin-bottom:0.8rem}
.prompt-join p{font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem;line-height:1.4}

.crew-hero{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:0.55rem}
.crew-hero-img{height:80px;background:linear-gradient(135deg,#2a2a38,#15151c);display:flex;align-items:flex-end;padding:0.6rem 0.85rem}
.crew-hero-img span{font-weight:900;font-size:1.15rem;text-transform:uppercase;letter-spacing:0.5px}
.crew-hero-body{padding:0.7rem 0.85rem;text-align:center}
.crew-hero-body .sub{font-size:0.72rem;color:var(--muted)}
.crew-hero-body .req{font-size:0.68rem;color:var(--gold);font-weight:600;margin-top:0.2rem}

.full-post{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:0.5rem}
.fp-crew{font-size:0.65rem;font-weight:700;color:var(--purple);margin-bottom:0.5rem;text-transform:uppercase}
.fp-head{display:flex;align-items:center;gap:0.55rem;margin-bottom:0.65rem;cursor:pointer}
.fp-av{width:42px;height:42px;border-radius:50%;background:#2a2a30;border:2px solid var(--gold);flex-shrink:0}
.fp-name{font-weight:800;font-size:0.92rem}
.fp-handle{font-size:0.7rem;color:var(--muted)}
.fp-body{font-size:1.02rem;line-height:1.5;margin-bottom:0.75rem}
.fp-sys{font-size:0.6rem;color:var(--dim);margin-bottom:0.3rem}

/* Momentum reaction carousel */
.react-wrap{position:relative;margin:0.4rem 0 0.6rem}
.react-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-behavior:auto;cursor:grab;padding:0.3rem 0}
.react-scroll:active{cursor:grabbing}
.react-scroll::-webkit-scrollbar{display:none}
.react-row{display:flex;gap:0.4rem;width:max-content;padding:0 0.2rem}
.react-btn{background:var(--sub);border:1.5px solid var(--border);border-radius:22px;padding:0.45rem 0.85rem;font-size:0.78rem;font-weight:700;cursor:pointer;color:var(--text);white-space:nowrap;transition:transform 0.12s,background 0.15s,border-color 0.15s;user-select:none}
.react-btn:active{transform:scale(0.92)}
.react-btn.active{border-color:var(--purple);background:rgba(139,92,246,0.25);color:var(--purple);box-shadow:0 0 12px var(--purple-glow)}
.react-btn .cnt{font-size:0.65rem;color:var(--muted);margin-left:0.25rem;font-weight:600}
.react-cost{font-size:0.6rem;color:var(--gold);margin-top:0.25rem;text-align:center}

.comment-section{margin-top:0.5rem}
.comment-box{display:flex;gap:0.35rem;margin-bottom:0.5rem}
.comment-input{flex:1;background:var(--sub);border:1px solid var(--border);border-radius:10px;padding:0.48rem 0.6rem;color:var(--text);font-size:0.8rem}
.comment-input:focus{outline:none;border-color:var(--purple)}
.comment{padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.comment:last-child{border-bottom:none}
.comment-author{font-weight:700;font-size:0.72rem;margin-bottom:0.12rem;cursor:pointer;color:var(--purple)}
.comment-text{color:var(--muted);line-height:1.4;font-size:0.82rem}
.comment-actions{display:flex;gap:0.6rem;margin-top:0.3rem;font-size:0.65rem}
.comment-actions span{color:var(--dim);cursor:pointer;font-weight:600}
.comment-actions span:hover{color:var(--purple)}
.reply-box{margin:0.35rem 0 0.35rem 1rem;display:flex;gap:0.3rem}
.reply-list{margin-left:0.9rem;border-left:2px solid rgba(139,92,246,0.2);padding-left:0.6rem;margin-top:0.3rem}
.reply{padding:0.35rem 0;font-size:0.78rem}
.reply .comment-author{font-size:0.68rem}
.reply .comment-text{font-size:0.78rem}

.compose-area{width:100%;background:var(--sub);border:1px solid var(--border);border-radius:11px;color:var(--text);padding:0.7rem;font-size:0.88rem;resize:none;min-height:90px;line-height:1.4}
.compose-area:focus{outline:none;border-color:var(--purple)}
.compose-bar{display:flex;justify-content:space-between;align-items:center;margin-top:0.45rem}
.cost{font-size:0.7rem;color:var(--gold);font-weight:600}
select.sel{width:100%;background:var(--sub);border:1px solid var(--border);border-radius:10px;padding:0.55rem 0.7rem;color:var(--text);font-size:0.84rem;margin-bottom:0.55rem}

.back{background:none;border:none;color:var(--purple);font-size:0.8rem;font-weight:700;cursor:pointer;margin-bottom:0.5rem}
.nav{background:rgba(18,21,28,0.96);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:0.4rem 0.1rem 0.55rem;display:flex;justify-content:space-around;flex-shrink:0}
.nav-btn{background:none;border:none;color:var(--muted);font-size:0.5rem;font-weight:700;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0.15rem 0.4rem}
.nav-btn .ic{font-size:1.1rem}
.nav-btn.active{color:var(--purple)}
.toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--card);border:1px solid var(--purple);color:var(--text);padding:0.55rem 0.9rem;border-radius:10px;font-size:0.74rem;font-weight:600;opacity:0;pointer-events:none;transition:all 0.25s;z-index:60;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,0.45)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.15s}
.flash.show{opacity:1}
.flash span{background:rgba(139,92,246,0.9);color:#fff;font-weight:800;font-size:1.1rem;padding:0.6rem 1.2rem;border-radius:30px;box-shadow:0 0 30px var(--purple-glow);transform:scale(0.8);transition:transform 0.2s}
.flash.show span{transform:scale(1)}

/* PHASE 1 — interaction polish */
.profile-card .bio-preview{max-width:310px;margin:.55rem auto 0;color:var(--muted);font-size:.78rem;line-height:1.45}
.avatar,.fp-av,.pt-av{object-fit:cover;background:#20232b center/cover no-repeat}
.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.65rem}
.crew-intro{display:flex;justify-content:space-between;align-items:end;gap:.6rem;margin:.2rem 0 .65rem}
.crew-intro h2{font-size:1rem;font-weight:850}.crew-intro p{font-size:.68rem;color:var(--muted);line-height:1.35}
.carousel-hint{font-size:.6rem;color:var(--dim);white-space:nowrap}
.crew-feed-title{display:flex;align-items:center;justify-content:space-between;margin:.15rem 0 .4rem}
.crew-feed-title span{font-size:.62rem;color:var(--muted)}
.react-wrap{margin:.7rem -.15rem .8rem;padding:.45rem .1rem .6rem;background:linear-gradient(180deg,rgba(139,92,246,.07),rgba(139,92,246,.015));border:1px solid rgba(139,92,246,.12);border-radius:14px}
.react-scroll{padding:.55rem .35rem .75rem;overscroll-behavior-x:contain}
.react-row{gap:.55rem}
.react-btn{min-width:104px;min-height:58px;border-radius:16px;padding:.6rem .75rem;font-size:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.react-btn .cnt{margin:0;font-size:.62rem}
.react-cost{margin-top:0;color:var(--muted)}
.reaction-label{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--purple);padding:0 .55rem}
.comment-section{padding-top:.15rem}.comment-list-wrap{max-height:none}
.hidden{display:none!important}
.empty{text-align:center;padding:1.3rem 1rem;color:var(--muted);font-size:0.84rem;line-height:1.45}
.file-input{display:none}
.star-hero{color:var(--cyan)}
.star-villain{color:var(--red)}
.dev-user{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.8rem}
.clickable{cursor:pointer}
.onboard-step{text-align:center;padding:0.5rem 0}
.onboard-step h3{font-size:1.1rem;margin-bottom:0.4rem}
.onboard-step p{font-size:0.8rem;color:var(--muted);margin-bottom:1rem;line-height:1.4}
</style>
</head>
<body>
<!-- FAYRGRND Phase 1 prototype: profiles + crews + post/reaction/comment loop. Test economy is localStorage only. -->
<div class="frame">
  <div class="auth" id="auth">
    <div class="auth-logo"><h1>FAYR<span>GRND</span></h1><p>One human. One account. Real status.</p></div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-su" onclick="authTab('su')">Sign Up</button>
        <button class="auth-tab" id="tab-li" onclick="authTab('li')">Log In</button>
      </div>
      <div class="auth-error" id="auth-err"></div>
      <div id="form-su">
        <div class="fg"><label>Display Name</label><input id="su-name" placeholder="Your name" maxlength="20"></div>
        <div class="fg"><label>Handle</label><input id="su-handle" placeholder="handle" maxlength="16"></div>
        <div class="fg"><label>Password</label><input id="su-pass" type="password" placeholder="••••••••"></div>
        <button class="auth-btn" onclick="signUp()">Create Account · £1</button>
      </div>
      <div id="form-li" class="hidden">
        <div class="fg"><label>Handle</label><input id="li-handle" placeholder="handle"></div>
        <div class="fg"><label>Password</label><input id="li-pass" type="password" placeholder="••••••••"></div>
        <button class="auth-btn" onclick="logIn()">Log In</button>
        <div style="text-align:center;margin-top:0.75rem"><span class="link-action" onclick="devLogin()">Developer login</span></div>
      </div>
    </div>
    <div class="auth-hint">Wallet created automatically. Starter fee £1 (simulated).</div>
  </div>

  <!-- LIGHT ONBOARDING -->
  <div class="auth hidden" id="onboard">
    <div class="auth-logo"><h1>Set up</h1><p>Make it yours</p></div>
    <div class="auth-card">
      <div class="onboard-step">
        <div class="fg"><label>Bio</label><textarea id="ob-bio" placeholder="Who are you?"></textarea></div>
        <div class="fg"><label>Theme</label>
          <select id="ob-theme">
            <option value="default">Default</option>
            <option value="gold">Founding</option>
            <option value="cyan">Beta</option>
            <option value="obsidian">Obsidian</option>
          </select>
        </div>
        <div class="fg"><label>Profile photo (optional)</label>
          <input type="file" id="ob-avatar" accept="image/*" onchange="obAvatar(event)">
        </div>
        <button class="auth-btn" onclick="finishOnboard()">Continue</button>
      </div>
    </div>
  </div>

  <div class="app" id="app">
    <div class="header">
      <div class="header-logo">FAYR<span>GRND</span></div>
      <div class="header-right">
        <div class="balance" id="bal">£0.00</div>
        <div class="status-pill">VERIFIED</div>
      </div>
    </div>

function users(){try{return JSON.parse(localStorage.getItem(DB)||'{}')}catch{return{}}}

function wallet(){const c='0123456789abcdef';let a='0x';for(let i=0;i<40;i++)a+=c[Math.floor(Math.random()*16)];return a}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function flash(msg){const f=document.getElementById('flash');document.getElementById('flash-text').textContent=msg;f.classList.add('show');setTimeout(()=>f.classList.remove('show'),450)}
function err(m){const e=document.getElementById('auth-err');e.textContent=m;e.style.display='block'}
function clearErr(){document.getElementById('auth-err').style.display='none'}
function ago(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function starStr(n,honour){const s=Math.round(n||3);const cls=(honour||50)>=50?'star-hero':'star-villain';return `<span class="${cls}">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`}
function memberCount(id){let n=0;Object.values(users()).forEach(x=>{if((x.crews||[]).includes(id))n++});return n}
function achProgress(user){const a=user.achievements||{};let done=0,total=0;ACHIEVEMENTS.forEach(x=>{total+=x.stages;done+=Math.min(x.stages,a[x.id]||0)});return total?Math.round(done/total*1000)/10:0}
function treasury(){return +(localStorage.getItem('FAYRGRND_TREASURY')||0)}
function creditTreasury(amount){localStorage.setItem('FAYRGRND_TREASURY',(treasury()+amount).toFixed(6))}
function deduct(user,amount){
  if((user.balance||0)<amount)return false;
  user.balance=+(user.balance-amount).toFixed(6);
  upd(user.handle,{balance:user.balance});
  const bal=document.getElementById('bal');if(bal)bal.textContent='£'+user.balance.toFixed(3);
  return true;
}
function rewardInteraction(authorHandle,cost){
  const creatorShare=+(cost*0.8).toFixed(6);
  const platformShare=+(cost-creatorShare).toFixed(6);
  const u=users();
  if(u[authorHandle] && authorHandle!==me()?.handle){
    u[authorHandle].balance=+((u[authorHandle].balance||0)+creatorShare).toFixed(6);
    u[authorHandle].ups=(u[authorHandle].ups||0)+1;
    saveUsers(u);
  }else if(authorHandle===me()?.handle){
    // No self-reward; the whole interaction stays in the platform treasury.
  }
  creditTreasury(platformShare);
}

function signUp(){
  clearErr();

  const u=users();if(u[handle])return err('Handle taken');
  const isFirst=Object.keys(u).filter(h=>!h.startsWith('_')&&!u[h].system).length===0;
  const user={handle,name,password:pass,wallet:wallet(),balance:11,bio:'',stars:3,honour:50,linkups:0,ups:0,events:0,crews:[],theme:isFirst?'gold':'default',title:isFirst?'FOUNDING':'MEMBER',avatar:'',achievements:{},badges:isFirst?['Founding']:['Beta'],traits:[{name:'Charismatic',lv:1},{name:'Empathetic',lv:1},{name:'Intelligent',lv:1}],myReacts:{},myCommentReacts:{},created:Date.now(),dev:false,onboarded:false};

}

function ensureSeed(){if(!posts().some(p=>p.system))seedData(true)}
function seedData(silent){
  let u=users();

    if(!u[d.handle])u[d.handle]={handle:d.handle,name:d.name,password:'x',wallet:wallet(),balance:8,bio:'',stars:d.stars,honour:d.honour,linkups:Math.floor(Math.random()*20),ups:Math.floor(50+Math.random()*150),events:0,crews:['fitness','cars','money'],theme:'default',title:d.title,avatar:'',achievements:{first_post:1,reactions:2,crew:1,commenter:1},badges:['System'],traits:d.traits,myReacts:{},myCommentReacts:{},created:Date.now()-86400000,system:true,onboarded:true};
  });
  saveUsers(u);
  let all=posts().filter(p=>!p.system);
  const now=Date.now();
  DUMMY_POSTS.forEach((d,i)=>{
    const du=DUMMY_USERS.find(x=>x.handle===d.handle)||DUMMY_USERS[0];
    all.push({id:'sys'+i,handle:d.handle,name:du.name,crew:d.crew,text:d.text,reacts:{Fire:1+Math.floor(Math.random()*4),Inspired:Math.floor(Math.random()*3)},comments:[],at:now-i*7200000,system:true});
  });

}

  if(v==='crews')renderCrews();
  if(v==='explore')renderExplore();
  if(v==='dev')renderDev();
  if(v==='profile')renderOwnProfile();

function renderCrews(){
  const user=me();
  const joined=user?.crews||[];
  const all=posts().sort((a,b)=>b.at-a.at);
  const barStyles=['purple','white','dark','purple','white','dark'];
  let html=`<div class="crew-intro"><div><h2>Your crews</h2><p>Swipe left and right through conversations. Open a post to react or comment.</p></div><div class="carousel-hint">SWIPE ↔</div></div>`;

  // Prompt if no crews joined
  if(!joined.length){
    html+=`<div class="prompt-join">
      <p>You haven’t joined any crews yet. Browse Popular below or explore everything.</p>
      <button class="btn small" style="width:auto;padding:0.4rem 1rem" onclick="show('explore')">Explore crews</button>
    </div>`;
  }

  // POPULAR
  html+=`<div class="crew-section">

  all.slice(0,12).forEach(p=>{
    const c=CREWS.find(x=>x.id===p.crew);
    const isJoined=joined.includes(p.crew);
    html+=`<div class="post-tile" onclick="openPost('${p.id}')">
      <div class="pt-head"><div class="pt-av" style="background-image:url('${users()[p.handle]?.avatar||''}')"></div><div class="pt-name clickable" onclick="event.stopPropagation();openUser('${p.handle}')">${esc(p.name)}</div></div>

      <div class="pt-text">${esc(p.text)}</div>
      ${!isJoined?`<div class="pt-join" onclick="event.stopPropagation();toggleJoin('${p.crew}')">Join ${c?.name||''}</div>`:''}
    </div>`;
  });
  html+=`</div></div></div>`;

  // Joined crews first as carousels, then other main crews
  const order=[...joined];
  CREWS.forEach(c=>{if(!order.includes(c.id))order.push(c.id)});

  order.forEach((cid,idx)=>{
    const c=CREWS.find(x=>x.id===cid);if(!c)return;
    const cPosts=all.filter(p=>p.crew===cid).slice(0,8);
    if(!cPosts.length && !joined.includes(cid))return;
    const style=barStyles[idx%barStyles.length];
    const joinedClass=joined.includes(cid)?' joined':'';
    html+=`<div class="crew-section">
      <div class="crew-bar ${style}${joinedClass}" onclick="openCrew('${cid}')"><span class="cb-name">${c.name}</span><span class="cb-stars">${'★'.repeat(c.minStars)}${'☆'.repeat(5-c.minStars)}</span></div>
      <div class="h-scroll"><div class="h-row">`;
    if(!cPosts.length){
      html+=`<div class="post-tile" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.78rem">No posts yet — be first</div>`;
    } else {
      cPosts.forEach(p=>{
        html+=`<div class="post-tile" onclick="openPost('${p.id}')">
          <div class="pt-head"><div class="pt-av" style="background-image:url('${users()[p.handle]?.avatar||''}')"></div><div class="pt-name clickable" onclick="event.stopPropagation();openUser('${p.handle}')">${esc(p.name)}</div></div>
          <div class="pt-text">${esc(p.text)}</div>
        </div>`;
      });
    }
    html+=`</div></div></div>`;
  });

  html+=`<button class="btn" style="margin-top:0.4rem" onclick="show('explore')">Explore all crews</button>`;
  document.getElementById('crews-content').innerHTML=html;
}

function renderExplore(){
  const user=me();
  const joined=user?.crews||[];
  const all=posts();
  const ranked=[...CREWS].sort((a,b)=>memberCount(b.id)-memberCount(a.id));
  document.getElementById('explore-list').innerHTML=ranked.map(c=>{
    const count=all.filter(p=>p.crew===c.id).length;
    const isJoined=joined.includes(c.id);
    return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:0.75rem 0.9rem" onclick="openCrew('${c.id}')">
      <div><div style="font-weight:700">${c.name}</div><div style="font-size:0.68rem;color:var(--muted)">${memberCount(c.id)} members · ${count} posts · ${c.minStars}★</div></div>
      <span class="link-action" style="font-size:0.72rem" onclick="event.stopPropagation();toggleJoin('${c.id}');renderExplore()">${isJoined?'Joined':'Join'}</span>
    </div>`;
  }).join('');
}

function toggleJoin(id){
  const user=me();if(!user)return;
  const c=CREWS.find(x=>x.id===id);if(!c)return;
  let crews=user.crews||[];
  if(crews.includes(id)){crews=crews.filter(x=>x!==id);upd(user.handle,{crews});toast('Left '+c.name)}
  else{
    if((user.stars||3)<c.minStars){toast('Need '+c.minStars+'★');return}
    crews.push(id);
    const ach=user.achievements||{};ach.crew=1;upd(user.handle,{crews,achievements:ach});toast('Joined '+c.name);flash('Joined!');
  }
  renderCrews();if(curCrew===id)openCrew(id);
}

function openCrew(id){
  curCrew=id;
  const c=CREWS.find(x=>x.id===id);if(!c)return;
  const user=me();
  const all=posts().filter(p=>p.crew===id).sort((a,b)=>b.at-a.at);
  const isJoined=(user?.crews||[]).includes(id);
  let html=`<div class="crew-hero">
    <div class="crew-hero-img"><span>${c.name}</span></div>
    <div class="crew-hero-body">
      <div class="sub">${memberCount(id)} members · ${all.length} posts</div>
      <div class="req">${c.minStars}★ to post</div>
      <div style="margin-top:0.4rem">${isJoined
        ?`<button class="btn secondary small" style="width:auto;padding:0.35rem 0.8rem" onclick="toggleJoin('${id}');openCrew('${id}')">Leave</button>`
        :`<button class="btn small" style="width:auto;padding:0.35rem 0.8rem" onclick="toggleJoin('${id}');openCrew('${id}')">Join</button>`}</div>
    </div>
  </div>
  <div class="h-scroll" style="margin-bottom:0.5rem"><div class="h-row">`;
  if(!all.length)html+=`<div class="empty" style="width:180px">No posts yet</div>`;
  else all.forEach(p=>{
    const author=users()[p.handle];
    html+=`<div class="post-tile" style="width:200px" onclick="openPost('${p.id}')">
      ${p.system?'<div class="fp-sys">System</div>':''}
      <div class="pt-head"><div class="pt-av" style="background-image:url('${users()[p.handle]?.avatar||''}')"></div><div class="pt-name clickable" onclick="event.stopPropagation();openUser('${p.handle}')">${esc(p.name)} ${starStr(author?.stars||3,author?.honour||50)}</div></div>
      <div class="pt-text">${esc(p.text)}</div>
    </div>`;
  });
  html+=`</div></div>`;
  document.getElementById('crew-detail').innerHTML=html;
  show('crew');
}

function openCompose(){
  returnTo=curCrew?'crew':'crews';
  const user=me();
  const joined=user?.crews||[];
  if(!joined.length){toast('Join a crew first');show('explore');return}
  const sel=document.getElementById('compose-target');sel.innerHTML='';
  joined.forEach(id=>{const c=CREWS.find(x=>x.id===id);if(!c)return;const o=document.createElement('option');o.value=c.id;o.textContent=c.name;if(curCrew===c.id)o.selected=true;sel.appendChild(o)});
  document.getElementById('compose-text').value='';show('compose');
}
function closeCompose(){if(curCrew)openCrew(curCrew);else show('crews')}
function submitPost(){
  const user=me();if(!user)return;
  const text=document.getElementById('compose-text').value.trim();
  if(!text)return toast('Write something');
  const crew=document.getElementById('compose-target').value;
  const c=CREWS.find(x=>x.id===crew);
  if(!c)return toast('Choose a crew');
  if(!(user.crews||[]).includes(crew))return toast('Join the crew first');
  if((user.stars||3)<c.minStars)return toast('Need '+c.minStars+'★ to post here');
  if(!deduct(user,COST_POST))return toast('Not enough balance');
  creditTreasury(COST_POST);
  const ach=user.achievements||{};ach.first_post=1;
  upd(user.handle,{achievements:ach,ups:(user.ups||0)+1});
  const p={id:'p'+Date.now(),handle:user.handle,name:user.name,crew,text,reacts:{},comments:[],at:Date.now()};
  const all=posts();all.push(p);savePosts(all);
  toast('Posted');flash('Posted!');curCrew=crew;openCrew(crew);
}

function openPost(id){
  returnTo=curCrew?'crew':'crews';
  const p=posts().find(x=>x.id===id);if(!p)return;
  const user=me();
  const c=CREWS.find(x=>x.id===p.crew);
  const author=users()[p.handle];
  const myReact=(user?.myReacts||{})[id]||null;

  // Build doubled reaction list for seamless loop feel
  const reactButtons=REACTIONS.map(r=>{
    const n=(p.reacts&&p.reacts[r])||0;
    return `<button class="react-btn ${myReact===r?'active':''}" data-r="${r}" onclick="react('${id}','${r}')">${r}<span class="cnt">${n||''}</span></button>`;
  }).join('');

  let html=`<div class="full-post">
    <div class="fp-crew">${c?.name||p.crew}${p.system?' · System':''}</div>
    <div class="fp-head" onclick="openUser('${p.handle}')">
      <div class="fp-av" style="background-image:url('${author?.avatar||''}')"></div>
      <div>
        <div class="fp-name">${esc(p.name)} ${starStr(author?.stars||3,author?.honour||50)}</div>
        <div class="fp-handle">@${p.handle} · ${ago(p.at)}</div>
      </div>
    </div>
    <div class="fp-body">${esc(p.text)}</div>
    <div class="react-wrap">
      <div class="react-scroll" id="react-scroll">
        <div class="react-row">${reactButtons}</div>
      </div>
      <div class="react-cost">React · £${COST_REACT}</div>
    </div>
    <div class="comment-section">
      <div class="card-title">Comments · £${COST_COMMENT}</div>
      <div class="comment-box">
        <input class="comment-input" id="comment-input" placeholder="Write a comment...">
        <button class="btn small" style="width:auto;padding:0.4rem 0.65rem" onclick="addComment('${id}')">Post</button>
      </div>
      <div id="comment-list">${renderComments(p,id)}</div>
    </div>
  </div>
  <button class="btn secondary small" style="margin-bottom:0.35rem" onclick="openCrew('${p.crew}')">Go to ${c?.name||'crew'}</button>
  <button class="btn" onclick="openCompose()">Create A Post · £${COST_POST}</button>`;
  document.getElementById('post-detail').innerHTML=html;
  show('post');
  initMomentumScroll(document.getElementById('react-scroll'));
}

function renderComments(p,pid){
  const comments=p.comments||[];
  if(!comments.length)return '<div class="empty" style="padding:0.7rem 0">No comments yet</div>';
  return comments.map((cm,i)=>{
    let replies='';
    if(cm.replies&&cm.replies.length){
      replies=`<div class="reply-list">${cm.replies.map(r=>`
        <div class="reply">
          <div class="comment-author" onclick="openUser('${r.handle}')">@${r.handle}</div>
          <div class="comment-text">${esc(r.text)}</div>
        </div>`).join('')}</div>`;
    }
    const reacts=cm.reacts||{};
    const total=Object.values(reacts).reduce((a,b)=>a+b,0);
    return `<div class="comment">
      <div class="comment-author" onclick="openUser('${cm.handle}')">@${cm.handle}</div>
      <div class="comment-text">${esc(cm.text)}</div>
      <div class="comment-actions">
        <span onclick="reactToComment('${pid}',${i})">React${total?' · '+total:''}</span>
        <span onclick="showReplyBox('${pid}',${i})">Reply</span>
      </div>
      <div id="reply-box-${i}" class="hidden reply-box">
        <input class="comment-input" id="reply-input-${i}" placeholder="Reply...">
        <button class="btn small" style="width:auto;padding:0.35rem 0.55rem" onclick="addReply('${pid}',${i})">Send</button>
      </div>
      ${replies}
    </div>`;
  }).join('');
}

function initMomentumScroll(el){
  if(!el)return;
  let isDown=false,startX=0,scrollLeft=0,lastX=0,lastT=0,vel=0;
  const onDown=e=>{
    isDown=true;el.style.cursor='grabbing';
    startX=(e.touches?e.touches[0].pageX:e.pageX)-el.offsetLeft;
    scrollLeft=el.scrollLeft;lastX=startX;lastT=Date.now();vel=0;
    if(reactMomentum.raf)cancelAnimationFrame(reactMomentum.raf);
  };
  const onUp=()=>{
    if(!isDown)return;isDown=false;el.style.cursor='grab';
    // momentum
    const tick=()=>{
      if(Math.abs(vel)<0.3)return;
      el.scrollLeft-=vel;
      vel*=0.95;
      reactMomentum.raf=requestAnimationFrame(tick);
    };
    reactMomentum.raf=requestAnimationFrame(tick);
  };
  const onMove=e=>{
    if(!isDown)return;
    e.preventDefault();
    const x=(e.touches?e.touches[0].pageX:e.pageX)-el.offsetLeft;
    const walk=(x-startX)*1.2;
    el.scrollLeft=scrollLeft-walk;
    const now=Date.now();
    const dt=now-lastT||16;
    vel=(x-lastX)/dt*16;
    lastX=x;lastT=now;
  };
  el.onmousedown=onDown;el.onmouseup=onUp;el.onmouseleave=onUp;el.onmousemove=onMove;
  el.ontouchstart=onDown;el.ontouchend=onUp;el.ontouchmove=onMove;
}

function react(pid,rid){
  const user=me();if(!user)return;
  const all=posts();const p=all.find(x=>x.id===pid);if(!p)return;
  if(!p.reacts)p.reacts={};
  const myReacts=user.myReacts||{};
  const prev=myReacts[pid];
  if(prev===rid){
    // toggle off free
    if(p.reacts[prev])p.reacts[prev]=Math.max(0,(p.reacts[prev]||0)-1);
    delete myReacts[pid];
    upd(user.handle,{myReacts});savePosts(all);toast('Removed');openPost(pid);return;
  }
  if(!deduct(user,COST_REACT))return toast('Not enough balance');
  if(prev&&p.reacts[prev])p.reacts[prev]=Math.max(0,(p.reacts[prev]||0)-1);
  p.reacts[rid]=(p.reacts[rid]||0)+1;
  myReacts[pid]=rid;
  rewardInteraction(p.handle,COST_REACT);
  const ach=user.achievements||{};ach.reactions=Math.min(3,(ach.reactions||0)+1);upd(user.handle,{achievements:ach,myReacts});
  savePosts(all);flash(rid+'!');toast('Reacted');openPost(pid);
}

function addComment(pid){
  const user=me();if(!user)return;
  const text=(document.getElementById('comment-input')?.value||'').trim();
  if(!text)return toast('Write a comment');
  if(!deduct(user,COST_COMMENT))return toast('Not enough balance');
  const all=posts();const p=all.find(x=>x.id===pid);if(!p)return;
  if(!p.comments)p.comments=[];
  p.comments.push({handle:user.handle,name:user.name,text,at:Date.now(),replies:[],reacts:{}});
  savePosts(all);
  rewardInteraction(p.handle,COST_COMMENT);
  const ach=user.achievements||{};ach.commenter=Math.min(3,(ach.commenter||0)+1);upd(user.handle,{achievements:ach});
  toast('Commented');flash('Commented!');openPost(pid);
}
function showReplyBox(pid,idx){
  const box=document.getElementById('reply-box-'+idx);
  if(box)box.classList.toggle('hidden');
}
function addReply(pid,idx){
  const user=me();if(!user)return;
  const input=document.getElementById('reply-input-'+idx);
  const text=(input?.value||'').trim();
  if(!text)return toast('Write a reply');
  if(!deduct(user,COST_COMMENT))return toast('Not enough balance');
  const all=posts();const p=all.find(x=>x.id===pid);if(!p||!p.comments[idx])return;
  if(!p.comments[idx].replies)p.comments[idx].replies=[];
  p.comments[idx].replies.push({handle:user.handle,name:user.name,text,at:Date.now()});
  savePosts(all);
  rewardInteraction(p.handle,COST_COMMENT);
  toast('Replied');flash('Replied!');openPost(pid);
}
function reactToComment(pid,idx){
  const user=me();if(!user)return;
  if(!deduct(user,COST_REACT))return toast('Not enough balance');
  const all=posts();const p=all.find(x=>x.id===pid);if(!p||!p.comments[idx])return;
  if(!p.comments[idx].reacts)p.comments[idx].reacts={};
  p.comments[idx].reacts.Fire=(p.comments[idx].reacts.Fire||0)+1;
  savePosts(all);
  rewardInteraction(p.comments[idx].handle,COST_REACT);
  flash('Reacted!');toast('Reacted to comment');openPost(pid);
}
function closePost(){if(curCrew)openCrew(curCrew);else show('crews')}

function renderDev(){
  const list=Object.values(users()).filter(x=>x.handle);
  document.getElementById('dev-users').innerHTML=list.map(x=>`
    <div class="dev-user">
      <div><strong class="clickable" onclick="openUser('${x.handle}')">@${x.handle}</strong> · ${x.name}
        ${x.system?' <span style="color:var(--dim);font-size:0.65rem">sys</span>':''}
        ${x.dev?' <span style="color:var(--gold);font-size:0.65rem">DEV</span>':''}
        <div style="font-size:0.65rem;color:var(--muted)">£${(x.balance||0).toFixed(2)} · ${(x.crews||[]).length} crews</div>
      </div>
      ${x.dev?'':`<button class="btn danger small" style="width:auto;padding:0.28rem 0.5rem" onclick="deleteUser('${x.handle}')">Del</button>`}
    </div>`).join('')||'<div class="empty">No users</div>';
}
function deleteUser(handle){if(!confirm('Delete @'+handle+'?'))return;const u=users();delete u[handle];saveUsers(u);savePosts(posts().filter(p=>p.handle!==handle));toast('Deleted');renderDev()}
function wipeAll(){if(!confirm('Wipe everything?'))return;localStorage.removeItem(DB);localStorage.removeItem(POSTS);localStorage.removeItem(SES);location.reload()}

(function(){const h=ses();if(h){const u=users()[h];if(u){ensureSeed();if(!u.onboarded&&!u.dev){document.getElementById('auth').classList.add('hidden');document.getElementById('onboard').classList.remove('hidden');return}enter(u)}}})();
</script>
